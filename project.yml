name: Tessera
options:
  bundleIdPrefix: com.priyanshchordia
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  TesseraCore:
    path: .

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: minimal

targets:
  Tessera:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tessera
        excludes:
          - "**/.gitkeep"
          - "Resources/Info.plist"
          - "Resources/Tessera.storekit"
    dependencies:
      - package: TesseraCore
        product: TesseraCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.priyanshchordia.tessera
        INFOPLIST_FILE: Tessera/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        GENERATE_INFOPLIST_FILE: NO
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""

  TesseraAppTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: TesseraTests
    dependencies:
      - target: Tessera
      - package: TesseraCore
        product: TesseraCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.priyanshchordia.tessera.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Tessera:
    build:
      targets:
        Tessera: all
        TesseraAppTests: [test]
    run:
      storeKitConfiguration: Tessera/Resources/Tessera.storekit
    test:
      targets:
        - TesseraAppTests
      gatherCoverageData: false
